{{ define "page/head_start" }}
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="{{ .base_path }}assets/ant-design-vue/antd.min.css">
  <link rel="stylesheet" href="{{ .base_path }}assets/css/custom.min.css?{{ .cur_ver }}">
  <style>
    [v-cloak] { display: none !important; }
    
    /* === X-Panel Modern Aesthetic Theme (高级极简渐变) === */
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    body, #app, .ant-layout, #content-layout, .ant-layout-content {
      background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 50%, #eef2f6 100%) !important;
      background-attachment: fixed !important;
      color: var(--text-main) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      -webkit-font-smoothing: antialiased !important;
    }

    /* 卡片：纯白温润磨砂、极细边框、无多余内边线 */
    .ant-card, .glass-card {
      background: #ffffff !important;
      border: 1px solid rgba(226, 232, 240, 0.8) !important;
      border-radius: 12px !important;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04) !important;
      margin-bottom: 16px !important;
      transition: all 0.2s ease !important;
    }

    .ant-card:hover {
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08) !important;
    }

    .ant-card-head {
      border-bottom: 1px solid #f1f5f9 !important;
      padding: 0 18px !important;
      min-height: 48px !important;
      background: #ffffff !important;
      border-radius: 12px 12px 0 0 !important;
    }

    /* 标题与文字：纯正清晰黑、告别反白看不清 */
    .ant-card-head-title, .ant-table-thead > tr > th, .ant-modal-title, .ant-collapse-header,
    .ant-form-item-label label, .ant-list-item-meta-title, b, strong, h1, h2, h3 {
      color: var(--text-main) !important;
      font-weight: 700 !important;
      letter-spacing: 0.2px !important;
    }

    .ant-statistic-title, .stat-title, .text-muted, .ant-form-explain {
      color: var(--text-muted) !important;
      font-size: 13px !important;
      font-weight: 600 !important;
    }

    /* 核心数据大字：湛蓝清晰、无框大字 */
    .ant-statistic {
      background: transparent !important;
      border: none !important;
      padding: 0 !important;
    }

    .ant-statistic-content-value, .stat-value {
      color: var(--primary) !important;
      font-size: 24px !important;
      font-weight: 800 !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
    }

    /* 按钮：深蓝实色主按钮、纯白文字、高质感次级按钮 */
    .ant-btn {
      height: 36px !important;
      border-radius: 6px !important;
      font-weight: 700 !important;
      font-size: 13.5px !important;
    }

    .ant-btn-primary {
      background: var(--primary) !important;
      border-color: var(--primary) !important;
      color: #ffffff !important;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25) !important;
    }

    .ant-btn-primary:hover {
      background: var(--primary-hover) !important;
      border-color: var(--primary-hover) !important;
    }

    .ant-btn:not(.ant-btn-primary):not(.ant-btn-danger) {
      background: #ffffff !important;
      border: 1px solid var(--border) !important;
      color: var(--text-main) !important;
    }

    .ant-btn:not(.ant-btn-primary):not(.ant-btn-danger):hover {
      background: #f8fafc !important;
      border-color: #cbd5e1 !important;
      color: var(--primary) !important;
    }

    .ant-btn-danger {
      background: #ef4444 !important;
      border-color: #ef4444 !important;
      color: #ffffff !important;
    }

    /* 表格与输入框 */
    .ant-table {
      background: #ffffff !important;
      color: var(--text-main) !important;
    }

    .ant-table-thead > tr > th {
      background: #f8fafc !important;
      color: var(--text-main) !important;
      font-weight: 700 !important;
      border-bottom: 1px solid #f1f5f9 !important;
    }

    .ant-table-tbody > tr > td {
      border-bottom: 1px solid #f8fafc !important;
      color: var(--text-main) !important;
    }

    .ant-input, .ant-input-password, .ant-input-number, .ant-select-selection {
      background: #ffffff !important;
      border: 1px solid var(--border) !important;
      color: var(--text-main) !important;
      border-radius: 6px !important;
    }

    .ant-input:focus, .ant-input-password:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15) !important;
    }

    /* 侧边栏与菜单 */
    .ant-layout-sider, .ant-menu {
      background: #ffffff !important;
      border-right: 1px solid var(--border) !important;
    }

    .ant-menu-item {
      color: var(--text-muted) !important;
      font-weight: 600 !important;
      border-radius: 6px !important;
      margin: 4px 8px !important;
      width: calc(100% - 16px) !important;
    }

    .ant-menu-item:hover {
      color: var(--primary) !important;
      background: #f8fafc !important;
    }

    .ant-menu-item-selected {
      background: #eff6ff !important;
      color: var(--primary) !important;
      font-weight: 700 !important;
    }

    /* 标签与徽章 */
    .ant-tag {
      border-radius: 4px !important;
      font-weight: 600 !important;
    }
  </style>
  <title>{{ .host }} – {{ i18n .title}}</title>
{{ end }}

{{ define "page/head_end" }}
</head>
{{ end }}

{{ define "page/body_start" }}
<body>
  <div id="message"></div>
{{ end }}

{{ define "page/body_scripts" }}
<script src="{{ .base_path }}assets/vue/vue.min.js?{{ .cur_ver }}"></script>
<script src="{{ .base_path }}assets/moment/moment.min.js?{{ .cur_ver }}"></script>
<script src="{{ .base_path }}assets/ant-design-vue/antd.min.js?{{ .cur_ver }}"></script>
<script src="{{ .base_path }}assets/axios/axios.min.js?{{ .cur_ver }}"></script>
<script src="{{ .base_path }}assets/qs/qs.min.js?{{ .cur_ver }}"></script>
<script src="{{ .base_path }}assets/js/axios-init.js?{{ .cur_ver }}"></script>
<script src="{{ .base_path }}assets/js/util/date-util.js?{{ .cur_ver }}"></script>
<script src="{{ .base_path }}assets/js/util/index.js?{{ .cur_ver }}"></script>
<script>
  const basePath = '{{ .base_path }}';
  axios.defaults.baseURL = basePath;
</script>
{{ end }}
  
{{ define "page/body_end" }}
</body>
</html>
{{ end }}
